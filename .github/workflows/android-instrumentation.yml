name: Android Instrumentation
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-instrumentation.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-instrumentation.yml']
permissions:
  contents: read
jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "system-images;android-29;google_apis;x86_64"
      - name: Compile instrumentation tests
        working-directory: android
        run: gradle :app:assembleDebugAndroidTest
      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd android && gradle :app:connectedDebugAndroidTest
