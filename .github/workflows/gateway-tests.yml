name: Gateway Tests
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'tests/test_gateway.py'
      - 'ollama_gateway.py'
      - 'tests/test_ollama_gateway.py'
      - '.github/workflows/gateway-tests.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'tests/test_gateway.py'
      - 'ollama_gateway.py'
      - 'tests/test_ollama_gateway.py'
      - '.github/workflows/gateway-tests.yml'
permissions:
  contents: read
jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate syntax
        run: python -m compileall -q gateway ollama_gateway.py tests/test_gateway.py tests/test_ollama_gateway.py
      - name: Run gateway regression tests
        run: python -m unittest discover -s tests -p 'test_*gateway.py' -v
